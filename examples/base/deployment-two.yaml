apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockstumize-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mockstumize-worker
  template:
    metadata:
      labels:
        app: mockstumize-worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sleep
            - "3600"
